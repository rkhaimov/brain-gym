syntax = "proto3";

package ceramics.v1;

message SalesEntry {
  string listing_name = 1;
  double units_sold = 2;
  double earnings_kopecks = 3;
  double outlet_price_kopecks = 4;
  double outlet_share_kopecks = 5;
}

message CreateSalesEntryInput {
  string listing_name = 1;
  double units_sold = 2;
  double earnings_kopecks = 3;
  optional double outlet_price_kopecks = 4;
}

message StockBalanceEntry {
  string listing_name = 1;
  double stock_balance = 2;
  double outlet_price_kopecks = 3;
}

message SalesReport {
  string id = 1;
  string outlet_id = 2;
  string period_start_date = 3;
  string period_end_date = 4;
  repeated SalesEntry sales = 5;
  repeated StockBalanceEntry stock_balances = 6;
}

message CreateSalesReportRequest {
  string outlet_id = 1;
  string period_start_date = 2;
  string period_end_date = 3;
  repeated CreateSalesEntryInput sales = 4;
  repeated StockBalanceEntry stock_balances = 5;
}

enum SalesReportSection {
  SALES_REPORT_SECTION_UNSPECIFIED = 0;
  SALES_REPORT_SECTION_SALES = 1;
  SALES_REPORT_SECTION_STOCK_BALANCE = 2;
}

enum SalesReportMutationFailureField {
  SALES_REPORT_MUTATION_FAILURE_FIELD_UNSPECIFIED = 0;
  SALES_REPORT_MUTATION_FAILURE_FIELD_OUTLET = 1;
  SALES_REPORT_MUTATION_FAILURE_FIELD_PERIOD_START = 2;
  SALES_REPORT_MUTATION_FAILURE_FIELD_PERIOD_END = 3;
  SALES_REPORT_MUTATION_FAILURE_FIELD_LISTING_NAME = 4;
  SALES_REPORT_MUTATION_FAILURE_FIELD_UNITS_SOLD = 5;
  SALES_REPORT_MUTATION_FAILURE_FIELD_EARNINGS = 6;
  SALES_REPORT_MUTATION_FAILURE_FIELD_STOCK_BALANCE = 7;
  SALES_REPORT_MUTATION_FAILURE_FIELD_OUTLET_PRICE = 8;
}

message SalesReportMutationFailure {
  SalesReportMutationFailureField field = 1;
  SalesReportSection section = 2;
  optional uint32 row_index = 3;
  string message = 4;
}

message CreateSalesReportResponse {
  oneof result {
    SalesReport success = 1;
    SalesReportMutationFailure failure = 2;
  }
}

message GetSalesReportRequest {
  string id = 1;
}

message GetSalesReportResponse {
  oneof result {
    SalesReport success = 1;
    SalesReportMutationFailure failure = 2;
  }
}

service SalesReportService {
  rpc CreateSalesReport(CreateSalesReportRequest) returns (CreateSalesReportResponse) {}
  rpc GetSalesReport(GetSalesReportRequest) returns (GetSalesReportResponse) {}
}
