syntax = "proto3";

package ceramics.v1;

message Outlet {
  string id = 1;
  string name = 2;
  reserved 3;
  bool archived = 4;
}

message CreateOutletRequest {
  string name = 1;
  reserved 2;
}

enum OutletMutationFailureField {
  OUTLET_MUTATION_FAILURE_FIELD_UNSPECIFIED = 0;
  OUTLET_MUTATION_FAILURE_FIELD_NAME = 1;
  reserved 2;
}

message OutletMutationFailure {
  OutletMutationFailureField field = 1;
  string message = 2;
}

message CreateOutletResponse {
  oneof result {
    Outlet success = 1;
    OutletMutationFailure failure = 2;
  }
}

message ListOutletsRequest {
  bool archived = 1;
}

message ListOutletsResponse {
  repeated Outlet outlets = 1;
}

message UpdateOutletRequest {
  string id = 1;
  string name = 2;
  reserved 3;
}

message UpdateOutletResponse {
  oneof result {
    Outlet success = 1;
    OutletMutationFailure failure = 2;
  }
}

message SetOutletArchivedRequest {
  string id = 1;
  bool archived = 2;
}

message SetOutletArchivedResponse {
  oneof result {
    Outlet success = 1;
    OutletMutationFailure failure = 2;
  }
}

service OutletService {
  rpc CreateOutlet(CreateOutletRequest) returns (CreateOutletResponse) {}
  rpc ListOutlets(ListOutletsRequest) returns (ListOutletsResponse) {}
  rpc UpdateOutlet(UpdateOutletRequest) returns (UpdateOutletResponse) {}
  rpc SetOutletArchived(SetOutletArchivedRequest) returns (SetOutletArchivedResponse) {}
}
