syntax = "proto3";

package ceramics.v1;

message Product {
  string id = 1;
  string name = 2;
}

message CreateProductRequest {
  string name = 1;
}

message CreateProductResponse {
  Product product = 1;
}

message ListProductsRequest {}

message ListProductsResponse {
  repeated Product products = 1;
}

enum ProductValidationField {
  PRODUCT_VALIDATION_FIELD_UNSPECIFIED = 0;
  PRODUCT_VALIDATION_FIELD_NAME = 1;
}

enum ProductValidationReason {
  PRODUCT_VALIDATION_REASON_UNSPECIFIED = 0;
  PRODUCT_VALIDATION_REASON_NAME_REQUIRED = 1;
  PRODUCT_VALIDATION_REASON_NAME_ALREADY_EXISTS = 2;
}

message ProductValidationError {
  ProductValidationField field = 1;
  ProductValidationReason reason = 2;
}

service ProductService {
  rpc CreateProduct(CreateProductRequest) returns (CreateProductResponse) {}
  rpc ListProducts(ListProductsRequest) returns (ListProductsResponse) {}
}
